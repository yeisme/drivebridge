# Change-aware CI maintained by scripts/maintain-workspace-ci.py.
name: CI
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.select.outputs.level }}
      integration: ${{ steps.select.outputs.integration }}
      docs_changed: ${{ steps.select.outputs.docs_changed }}
      go_changed: ${{ steps.select.outputs.go_changed }}
      python_changed: ${{ steps.select.outputs.python_changed }}
      web_changed: ${{ steps.select.outputs.web_changed }}
      legacy_changed: ${{ steps.select.outputs.legacy_changed }}
      spec_changed: ${{ steps.select.outputs.spec_changed }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: select
      run: python3 scripts/ci/changed_scope.py select
  docs-check:
    needs: scope
    if: needs.scope.outputs.level == 'docs' || needs.scope.outputs.docs_changed == 'true' || needs.scope.outputs.spec_changed
      == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@v4
      if: needs.scope.outputs.spec_changed == 'true'
      with:
        node-version: '22'
    - run: python3 scripts/ci/changed_scope.py docs
  version-check:
    needs: scope
    if: needs.scope.outputs.level != ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - run: python3 scripts/check-version.py
    - run: python3 scripts/ci/fresh_clone.py
  quick-check:
    needs: scope
    if: needs.scope.outputs.level == 'quick'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Affected Go packages and consumers
      run: python3 scripts/ci/quick_go.py
    - uses: pnpm/action-setup@v4
      with:
        version: '11.24.0'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Web checks
      working-directory: web
      env:
        NODE_OPTIONS: --no-experimental-webstorage
      run: |-
        pnpm install --frozen-lockfile
        pnpm run typecheck
        pnpm test
        pnpm run build
        pnpm exec playwright test tests/workspace-home.spec.ts tests/file-drag.spec.ts
    - name: Desktop checks
      working-directory: desktop
      run: |-
        pnpm install --frozen-lockfile
        pnpm run typecheck
        pnpm test
        curl -fsSL https://github.com/yeisme/pinax/releases/download/v0.3.0/pinax_0.3.0_linux_x86_64.tar.gz -o /tmp/pinax_0.3.0_linux_x86_64.tar.gz
        echo "120e81e4d493da7c205c9526ad119a24331d5c2e5004e80cbb739b50e37d7a47  /tmp/pinax_0.3.0_linux_x86_64.tar.gz" | sha256sum -c -
        mkdir -p /tmp/pinax-0.3.0
        tar -xzf /tmp/pinax_0.3.0_linux_x86_64.tar.gz -C /tmp/pinax-0.3.0
        DRIVEBRIDGE_PINAX_BIN=/tmp/pinax-0.3.0/pinax node scripts/prepare-host.mjs
        pnpm run package
        pnpm run check:package out/drivebridge-desktop-linux-x64
    - name: Contract checks
      run: make contracts-check
  check-full:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Affected Go packages and consumers
      run: python3 scripts/ci/quick_go.py --all
    - uses: pnpm/action-setup@v4
      with:
        version: '11.24.0'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Web checks
      working-directory: web
      env:
        NODE_OPTIONS: --no-experimental-webstorage
      run: |-
        pnpm install --frozen-lockfile
        pnpm run typecheck
        pnpm test
        pnpm run build
    - name: Desktop checks
      working-directory: desktop
      run: |-
        pnpm install --frozen-lockfile
        pnpm run typecheck
        pnpm test
        curl -fsSL https://github.com/yeisme/pinax/releases/download/v0.3.0/pinax_0.3.0_linux_x86_64.tar.gz -o /tmp/pinax_0.3.0_linux_x86_64.tar.gz
        echo "120e81e4d493da7c205c9526ad119a24331d5c2e5004e80cbb739b50e37d7a47  /tmp/pinax_0.3.0_linux_x86_64.tar.gz" | sha256sum -c -
        mkdir -p /tmp/pinax-0.3.0
        tar -xzf /tmp/pinax_0.3.0_linux_x86_64.tar.gz -C /tmp/pinax-0.3.0
        DRIVEBRIDGE_PINAX_BIN=/tmp/pinax-0.3.0/pinax node scripts/prepare-host.mjs
        pnpm run package
        pnpm run check:package out/drivebridge-desktop-linux-x64
    - name: Contract checks
      run: make contracts-check
    name: Full / check
    needs:
    - scope
    if: needs.scope.outputs.level == 'full'
  check:
    name: check
    if: always()
    needs:
    - scope
    - docs-check
    - version-check
    - quick-check
    - check-full
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
    - name: Require selected checks
      shell: python
      run: |
        import json, os, sys
        needs = json.loads(os.environ["NEEDS_JSON"])
        if needs["scope"]["result"] != "success":
            sys.exit("Change selection did not succeed")
        level = needs["scope"]["outputs"]["level"]
        if level not in ("docs", "quick", "full"):
            sys.exit("Unknown check level")
        for name, value in needs.items():
            if name == "scope":
                continue
            expected = (name == "docs-check" and (level == "docs" or needs["scope"]["outputs"].get("docs_changed") == "true" or needs["scope"]["outputs"].get("spec_changed") == "true")) or (name == "quick-check" and level == "quick") or (name == "version-check") or (name not in ("docs-check", "quick-check", "version-check") and level == "full")
            wanted = "success" if expected else "skipped"
            if value["result"] != wanted:
                sys.exit(f"{name}: expected {wanted}, got {value['result']}")
        print(f"CI passed: level={level}; unrelated lanes intentionally skipped")
'on':
  pull_request: null
  push:
    branches:
    - main
    - develop
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
