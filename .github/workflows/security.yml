name: Security and release evidence

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4

  codeql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        if: matrix.language == 'javascript-typescript'
        with:
          version: '11.24.0'
      - uses: actions/setup-node@v4
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build Go code
        if: matrix.language == 'go'
        run: GOWORK=off CGO_ENABLED=0 go build ./cmd/drivebridge && GOWORK=off CGO_ENABLED=0 go -C server build ./cmd/drivebridge-server
      - name: Build Web code
        if: matrix.language == 'javascript-typescript'
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build
      - uses: github/codeql-action/analyze@v3

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go modules
        run: |
          GOWORK=off govulncheck ./...
          (cd server && GOWORK=off govulncheck ./...)

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@v0.17.0
        with:
          path: .
          artifact-name: drivebridge-sbom.spdx.json
          output-file: drivebridge-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: drivebridge-sbom
          path: drivebridge-sbom.spdx.json
