name: Nightly and release gate

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: python3 scripts/check-version.py
      - run: DRIVEBRIDGE_PINAX_READER_CONTRACT_SOURCE=fixture make contracts-check
      - run: GOWORK=off CGO_ENABLED=0 go test ./... -count=1 -timeout=15m
      - run: GOWORK=off CGO_ENABLED=0 go -C server test ./... -count=1 -timeout=20m
      - run: pnpm --dir web test
        env:
          NODE_OPTIONS: --no-experimental-webstorage
      - run: pnpm --dir web build
      - run: pnpm --dir desktop exec node scripts/build.mjs
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - name: Prepare Pinax host binary
        working-directory: desktop
        run: |-
          curl -fsSL https://github.com/yeisme/pinax/releases/download/v0.3.0/pinax_0.3.0_linux_x86_64.tar.gz -o /tmp/pinax_0.3.0_linux_x86_64.tar.gz
          echo "120e81e4d493da7c205c9526ad119a24331d5c2e5004e80cbb739b50e37d7a47  /tmp/pinax_0.3.0_linux_x86_64.tar.gz" | sha256sum -c -
          mkdir -p /tmp/pinax-0.3.0
          tar -xzf /tmp/pinax_0.3.0_linux_x86_64.tar.gz -C /tmp/pinax-0.3.0
          DRIVEBRIDGE_PINAX_BIN=/tmp/pinax-0.3.0/pinax node scripts/prepare-host.mjs
      - run: pnpm --dir desktop package
      - run: pnpm --dir desktop check:package out/drivebridge-desktop-linux-x64
      - run: python3 scripts/build.py --target linux/amd64 --target linux/arm64 --target windows/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: drivebridge-distribution
          path: temp/distribution
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: 'temp/distribution/*'
